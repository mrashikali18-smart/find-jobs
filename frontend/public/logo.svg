<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .ink { fill: #0f2b2a; }
      .amber { fill: #f5a623; }
      .paper { fill: #f8f6f1; }
    </style>
  </defs>

  <!-- background circle -->
  <circle cx="32" cy="32" r="30" class="ink" />

  <!-- briefcase (jobs) -->
  <rect x="18" y="26" width="24" height="17" rx="3" class="paper" />
  <rect x="25" y="21" width="10" height="7" rx="2" class="paper" />
  <rect x="27.5" y="23.5" width="5" height="4" rx="1" class="ink" />
  <rect x="18" y="33" width="24" height="3.5" class="amber" />

  <!-- magnifying glass (find), overlapping bottom-right -->
  <circle cx="41" cy="41" r="9" class="paper" />
  <circle cx="41" cy="41" r="6.2" class="ink" />
  <rect x="46.8" y="46.8" width="10" height="5" rx="2.5" transform="rotate(45 46.8 46.8)" class="amber" />
</svg>
